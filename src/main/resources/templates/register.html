<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>MotoGP</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar">
	<div class="navbar-container">
		<div class="navbar-logo">
			<a th:if="${isAdmin}" th:href="@{'/'}" th:text="'MotoGP - Admin'"></a>
			<a th:if="${!isAdmin}" th:href="@{'/'}" th:text="'MotoGP'"></a>
		</div>
		<ul class="navbar-menu">
			<li class="navbar-item"><a th:href="@{'/pilotiETeam'}">Piloti e Team</a></li>
			<li class="navbar-item"><a th:href="@{'/granPremi'}">Gran Premi</a></li>
			<li class="navbar-item"><a th:href="@{'/campionati'}">Campionato</a></li>
			<li class="navbar-item">
				<a th:if="${isAnonymous}" th:href="'/login'" th:text="'Login/Registrati'"></a>
				<a th:if="${!isAnonymous}" th:href="'/logout'" th:text="${username} + ' - Logout'"></a>
			</li>
		</ul>
	</div>
</nav>
<main>
	<section class="formGenerico">
		<h2>Registrati</h2>

		<form th:action="@{/register}" method="post" th:object="${userDto}">
			<div class="input-field">
				<label for="name">Nome</label>
				<input type="text" name="name" id="name" th:field="*{name}" required>
			</div>
			<div class="input-field">
				<label for="surname">Cognome</label>
				<input type="text" name="surname" id="surname" th:field="*{surname}" required>
			</div>
			<div class="input-field">
				<label for="email">Email</label>
				<input type="text" name="email" id="email" th:field="*{email}" required>
			</div>
			<div class="input-field">
				<label for="username">Username</label>
				<input type="text" name="username" id="username" th:field="*{username}" required>
			</div>

			<div class="input-field">
				<label for="password">Password</label>
				<input type="password" name="password" id="password" th:field="*{password}" required>
			</div>

			<div>
				<button type="submit" class="button">Registrati</button>
			</div>
		</form>

		<p>
			Hai già un account?
			<a href="/login" class="link-button">Accedi</a>
		</p>
	</section>
</main>
</body>
</html>
