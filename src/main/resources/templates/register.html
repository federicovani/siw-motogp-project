<!DOCTYPE html>
<html>
	<head>
	    <title>Registrazione</title>
		<link rel="stylesheet" href="css/index.css">
		<link rel="stylesheet" href="css/register.css">
	</head>
	
	<body>
		
		<header>
					
			<nav class="nav">
				<a href="/" class="nav-link">Home</a>
				<a href="/pilotiETeam" class="nav-link">Piloti e Team</a>
				<a href="/granPremi" class="nav-link">Gran Premi</a>
				<a href="/campionati" class="nav-link">Campionato</a>
				<a href="" class="nav-link">Shop</a>
				<a href="/login" class="nav-link">Accedi/Registrati</a>
			</nav>
		</header>
		
		<hr>
		
		<main>
			<div>
				<h1 class="title">Accedi</h1>
				
				<form th:action="@{/register}" method="post" th:object="${userDto}">
					<div class="input-field">
						<label for="name">Nome</label>
						<input type="text" name="name" id="name" th:field="*{name}" required>
					</div>
					<div class="input-field">
						<label for="surname">Cognome</label>
						<input type="text" name="surname" id="surname" th:field="*{surname}" required>
					</div>
					<div class="input-field">
						<label for="email">Email</label>
						<input type="text" name="email" id="email" th:field="*{email}" required>
					</div>
					<div class="input-field">
						<label for="username">Username</label>
						<input type="text" name="username" id="username" th:field="*{username}" required>
					</div>
					
					<div class="input-field">
						<label for="password">Password</label>
						<input type="password" name="password" id="password" th:field="*{password}" required>
					</div>
					
					<div>
						<button type="submit" class="button">Registrati</button>
					</div>
				</form>
				
				<p>
					Hai già un account?
					<a href="/login" class="link-button">Accedi</a>
				</p>
			</div>
		</main>
	</body>
</html>
