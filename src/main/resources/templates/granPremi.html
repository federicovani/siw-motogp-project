<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoGP</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/granPremi.css}">
</head>
<body>
<nav class="navbar">
    <div class="navbar-container">
        <div class="navbar-logo">
            <a th:if="${isAdmin}" th:href="@{'/'}" th:text="'MotoGP - Admin'"></a>
            <a th:if="${!isAdmin}" th:href="@{'/'}" th:text="'MotoGP'"></a>
        </div>
        <ul class="navbar-menu">
            <li class="navbar-item"><a th:href="@{'/pilotiETeam'}">Piloti e Team</a></li>
            <li class="navbar-item"><a th:href="@{'/granPremi'}">Gran Premi</a></li>
            <li class="navbar-item"><a th:href="@{'/campionati'}">Campionato</a></li>
            <li class="navbar-item">
                <a th:if="${isAnonymous}" th:href="'/login'" th:text="'Login/Registrati'"></a>
                <a th:if="${!isAnonymous}" th:href="'/logout'" th:text="${username} + ' - Logout'"></a>
            </li>
        </ul>
    </div>
</nav>

<main>
    <h2>Gran Premi</h2>

    <div th:if="${#lists.isEmpty(granPremi)}" class="empty-message">
        Nessun Gran Premio disponibile al momento.
    </div>

    <div th:if="${not #lists.isEmpty(granPremi)}" class="vertical-scroll-container">
        <div class="gp-card" th:each="gp : ${granPremi}">
            <h3 th:text="${#temporals.format(gp.data, 'dd/MM/yyyy')}">Data</h3>
            <p th:text="'Nazione: ' + ${gp.circuito.paese}">Nazione</p>
            <p th:text="'Numero di giri: ' + ${gp.numeroDiGiri}">Numero di giri</p>
            <p>Sponsor:</p>
            <ul>
                <li th:each="s : ${gp.sponsor}" th:text="${s.nome}">Sponsor</li>
            </ul>
        </div>
    </div>
</main>

</body>
</html>
