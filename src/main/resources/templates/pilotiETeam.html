<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Piloti e Team</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/pilotiETeam.css">
</head>

<body>

<header>
    <nav class="nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/pilotiETeam" class="nav-link">Piloti e Team</a>
        <a href="/granPremi" class="nav-link">Gran Premi</a>
        <a href="/campionati" class="nav-link">Campionato</a>
        <a href="/shop" class="nav-link">Shop</a>
        <a th:if="${user==null}" href="/login" class="nav-link">Accedi/Registrati</a>
        <a th:if="${user!=null}" href="/account" class="nav-link">Account</a>
    </nav>
</header>

<hr>

<main>
    <!-- Piloti Section -->
    <section>
        <h2>Piloti</h2>

        <div th:if="${#lists.isEmpty(piloti)}" class="empty-message">
            Nessun pilota disponibile al momento.
        </div>

        <div th:if="${not #lists.isEmpty(piloti)}" class="carousel-container">
            <button class="carousel-button prev" onclick="moveCarousel(-1, 'pilotiCarouselTrack')">❮</button>
            <div class="carousel-track" id="pilotiCarouselTrack" data-index="0">
                <div class="carousel-card" th:each="pilota : ${piloti}">
                    <img src="https://via.placeholder.com/300x200/000000/FFFFFF?text=Pilota+Image" alt="Immagine Pilota">
                    <h5 th:text="'#' + ${pilota.numeroIdentificativo} + ' - ' + ${pilota.nome} + ' ' + ${pilota.cognome}">Numero Nome Cognome</h5>
                    <p th:text="'Nazionalità: ' + ${pilota.nazionalita}">Nazionalità</p>
                    <p th:text="'Team: ' + ${pilota.team.nome}">Team</p>
                </div>
            </div>
            <button class="carousel-button next" onclick="moveCarousel(1, 'pilotiCarouselTrack')">❯</button>
        </div>
    </section>

    <hr>

    <!-- Team Section -->
    <section>
        <h2>Team</h2>

        <div th:if="${#lists.isEmpty(teams)}" class="empty-message">
            Nessun team disponibile al momento.
        </div>

        <div th:if="${not #lists.isEmpty(teams)}" class="carousel-container">
            <button class="carousel-button prev" onclick="moveCarousel(-1, 'teamCarouselTrack')">❮</button>
            <div class="carousel-track" id="teamCarouselTrack" data-index="0">
                <div class="carousel-card" th:each="team : ${teams}">
                    <img src="https://via.placeholder.com/300x200/000000/FFFFFF?text=Team+Image" alt="Immagine Team">
                    <h5 th:text="${team.nome}">Nome Team</h5>
                </div>
            </div>
            <button class="carousel-button next" onclick="moveCarousel(1, 'teamCarouselTrack')">❯</button>
        </div>
    </section>
</main>

<script>
    function moveCarousel(direction, trackId) {
        const track = document.getElementById(trackId);
        const cards = track.children;
        const visibleCards = 4;
        const totalCards = cards.length;

        if (totalCards <= visibleCards) return;

        let currentIndex = parseInt(track.getAttribute('data-index') || '0');

        const cardWidth = cards[0].offsetWidth + 20;

        const maxIndex = totalCards - visibleCards;
        currentIndex += direction;

        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex > maxIndex) currentIndex = maxIndex;

        track.setAttribute('data-index', currentIndex);
        track.style.transform = `translateX(-${currentIndex * cardWidth}px)`;
    }
</script>

</body>
</html>
