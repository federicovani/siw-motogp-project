<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Piloti e Team</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/css/index.css" />
</head>

<body style="background-color: black; color: white;">

  <!-- Navbar -->
  <header>
    <nav class="nav bg-dark p-3">
      <a href="/" class="nav-link text-white">Home</a>
      <a href="/pilotiETeam" class="nav-link text-white">Piloti e Team</a>
      <a href="/granPremi" class="nav-link text-white">Gran Premi</a>
      <a href="/campionati" class="nav-link text-white">Campionato</a>
      <a href="/shop" class="nav-link text-white">Shop</a>
      <a th:if="${user==null}" href="/login" class="nav-link text-white">Accedi/Registrati</a>
      <a th:if="${user!=null}" href="/account" class="nav-link text-white">Account</a>
    </nav>
  </header>

  <hr class="border-danger">

  <main class="container my-4">

    <!-- Piloti Section -->
    <section>
      <h2 class="text-center mb-4 text-danger">Piloti</h2>

      </div>
    </section>

    <hr class="my-5 border-danger">

    <!-- Team Section -->
    <section>
      <h2 class="text-center mb-4 text-danger">Team</h2>

      <div th:if="${#lists.isEmpty(teams)}" class="text-center">
        <p style="color: #ccc;">Nessun team disponibile al momento.</p>
      </div>

      <div th:if="${not #lists.isEmpty(teams)}" class="position-relative">

        <!-- Carousel Controls -->
        <button class="carousel-control-custom" type="button" data-bs-target="#teamCarousel" data-bs-slide="prev">
          &#8592;
        </button>

        <div id="teamCarousel" class="carousel slide" data-bs-ride="false">
          <div class="carousel-inner">
            <div class="carousel-item" th:each="chunk, iter : ${#lists.partition(teams, 4)}" th:classappend="${iter.index == 0} ? ' active'">
              <div class="row">
                <div class="col-6 col-md-3 mb-3" th:each="team : ${chunk}">
                  <div class="card h-100 bg-dark border-danger text-center">
                    <img src="https://via.placeholder.com/300x200/000000/FFFFFF?text=Team+Image" class="card-img-top" alt="Immagine Team">
                    <div class="card-body">
                      <h5 class="card-title text-danger" th:text="${team.nome}">Nome Team</h5>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <button class="carousel-control-custom" type="button" data-bs-target="#teamCarousel" data-bs-slide="next">
          &#8594;
        </button>
      </div>
    </section>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
