<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Piloti e Team</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/pilotieteam.css">
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        hr {
            border: 1px solid white;
            margin: 20px 0;
        }

        main {
            max-width: 1200px;
            margin: 20px auto;
            padding: 10px;
        }

        h2 {
            color: white;
            text-align: center;
        }

        .empty-message {
            text-align: center;
            color: #ccc;
            margin-top: 20px;
        }

        /* Carosello */
        .carousel-container {
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 1000px;
            margin: 20px auto;
        }

        .carousel-track {
            display: flex;
            transition: transform 0.5s ease;
        }

        .carousel-card {
            flex: 0 0 calc(25% - 20px);
            margin: 10px;
            background-color: #222;
            border: 1px solid white;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .carousel-card img {
            max-width: 100%;
            height: auto;
        }

        .carousel-card h5 {
            margin-top: 10px;
            color: white;
        }

        .carousel-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            z-index: 2;
            font-size: 24px;
        }

        .carousel-button:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }

        .carousel-button.prev {
            left: 0;
        }

        .carousel-button.next {
            right: 0;
        }
    </style>
</head>

<body>

<header>
    <nav class="nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/pilotiETeam" class="nav-link">Piloti e Team</a>
        <a href="/granPremi" class="nav-link">Gran Premi</a>
        <a href="/campionati" class="nav-link">Campionato</a>
        <a href="" class="nav-link">Shop</a>
        <a th:if="${user==null}" href="/login" class="nav-link">Accedi/Registrati</a>
        <a th:if="${user!=null}" href="/account" class="nav-link">Account</a>
    </nav>
</header>

<hr>

<main>
    <!-- Piloti Section -->
    <section>
        <h2>Piloti</h2>
        <div>
            <p class="empty-message">Sezione piloti temporaneamente vuota.</p>
        </div>
    </section>

    <hr>

    <!-- Team Section -->
    <section>
        <h2>Team</h2>

        <div th:if="${#lists.isEmpty(teams)}" class="empty-message">
            Nessun team disponibile al momento.
        </div>

        <div th:if="${not #lists.isEmpty(teams)}" class="carousel-container">
            <button class="carousel-button prev" onclick="moveCarousel(-1)">❮</button>
            <div class="carousel-track" id="carouselTrack">
                <div class="carousel-card" th:each="team : ${teams}">
                    <img src="https://via.placeholder.com/300x200/000000/FFFFFF?text=Team+Image" alt="Immagine Team">
                    <h5 th:text="${team.nome}">Nome Team</h5>
                </div>
            </div>
            <button class="carousel-button next" onclick="moveCarousel(1)">❯</button>
        </div>
    </section>
</main>

<script>
    let currentIndex = 0;

    function moveCarousel(direction) {
        const track = document.getElementById('carouselTrack');
        const cards = track.children;
        const visibleCards = 4;
        const totalCards = cards.length;

        if (totalCards <= visibleCards) return;  // niente da scorrere

        const cardWidth = cards[0].offsetWidth + 20;

        const maxIndex = totalCards - visibleCards;
        currentIndex += direction;

        if (currentIndex < 0) currentIndex = 0;
        if (currentIndex > maxIndex) currentIndex = maxIndex;

        track.style.transform = `translateX(-${currentIndex * cardWidth}px)`;
    }
</script>

</body>
</html>
