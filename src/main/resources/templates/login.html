<!DOCTYPE html>
<html>
	<head>
	    <title>Login</title>
		<link rel="stylesheet" href="css/index.css">
		<link rel="stylesheet" href="css/login.css">
	</head>
	
	<body>
		
		<header>
					
			<nav class="nav">
				<a href="/" class="nav-link">Home</a>
				<a href="/pilotiETeam" class="nav-link">Piloti e Team</a>
				<a href="/granPremi" class="nav-link">Gran Premi</a>
				<a href="/campionati" class="nav-link">Campionato</a>
				<a href="" class="nav-link">Shop</a>
				<a href="/login" class="nav-link">Accedi/Registrati</a>
			</nav>
		</header>
		
		<hr>
		
		<main>
			<div>
				<h1 class="title">Accedi</h1>
				
				<form th:action="@{/login}" method="post">
					<div class="input-field">
						<label for="username">Username</label>
						<input type="text" name="username" id="username" required>
					</div>
					
					<div class="input-field">
						<label for="password">Password</label>
						<input type="password" name="password" id="password" required>
					</div>
					
					<div>
						<button type="submit" class="button">Accedi</button>
					</div>
				</form>
				
				<p id="forgot-password">
					Password dimenticata?
					<a href="" class="link-button">Recupera Password</a>
				</p>
				
				<p>
					Non hai un account?
					<a href="/register" class="link-button">Registrati</a>
				</p>
			</div>
		</main>
	</body>
</html>
